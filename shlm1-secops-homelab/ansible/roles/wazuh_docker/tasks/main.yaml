- name: Install git
  ansible.builtin.dnf:
    name: git
    state: present

- name: Check if wazuh-docker repo already exists
  ansible.builtin.stat:
    path: "{{ wazuh_docker_repo_dest }}/.git"
  register: wazuh_repo_exists

- name: Clone wazuh-docker repo
  ansible.builtin.git:
    repo: "https://github.com/wazuh/wazuh-docker.git"
    dest: "{{ wazuh_docker_repo_dest }}"
    version: "{{ wazuh_docker_version }}"
  when: not wazuh_repo_exists.stat.exists

- name: Check if indexer certs already exist
  ansible.builtin.stat:
    path: "{{ wazuh_docker_repo_dest }}/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem"
  register: certs_exist

- name: Generate indexer certs
  community.docker.docker_compose_v2:
    project_src: "{{ wazuh_docker_repo_dest }}/single-node"
    files:
      - generate-indexer-certs.yml
    state: present
  when: not certs_exist.stat.exists0

- name: Template environment file with vaulted credentials
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ wazuh_docker_repo_dest }}/single-node/.env"
    mode: '0600'

- name: Add syslog remote listener for OPNsense firewall logs
  ansible.builtin.blockinfile:
    path: "{{ wazuh_docker_repo_dest }}/single-node/config/wazuh_cluster/wazuh_manager.conf"
    insertbefore: "</ossec_config>"
    marker: "<!-- {mark} OPNSENSE SYSLOG REMOTE -->"
    block: |
      <remote>
        <connection>syslog</connection>
        <port>514</port>
        <protocol>udp</protocol>
        <allowed-ips>{{ opnsense_lan_ip }}</allowed-ips>
      </remote>

- name: Start Wazuh stack
  community.docker.docker_compose_v2:
    project_src: "{{ wazuh_docker_repo_dest }}/single-node"
    state: present